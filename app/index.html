    <script>
      (function () {
        var n = window.navigator;
        var ua = n.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua);
        var standalone = window.matchMedia('(display-mode: standalone)').matches || n.standalone;
        if (ios && !standalone && 'serviceWorker' in n) {
          n.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).catch(function () {});
          if (typeof caches !== 'undefined') {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {});
          }
        }
      })();
    </script>
    <script>
      (function () {
        var n = window.navigator;
        var standalone = window.matchMedia('(display-mode: standalone)').matches || n.standalone;
        if (!standalone) return;
        var root = document.documentElement;
        var ua = n.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua) || n.standalone;
        var android = /Android/i.test(ua) && !ios;
        root.classList.add('is-standalone');
        if (ios) root.classList.add('is-ios-standalone');
        if (android) root.classList.add('is-android-standalone');
      })();
    </script>
    <style>
      html, body, #root { height: 100dvh; margin: 0; background: #fff; }
      html.is-ios-standalone, html.is-ios-standalone body, html.is-ios-standalone #root { height: 100vh; }
      html.is-onboarding, html.is-onboarding body, html.is-onboarding #root { background: #fff; }
      /*
        iPhone Home only: critical inset before CSS bundle (env() is often 0 in standalone).
      */
      html.is-ios-standalone {
        --ios-nav-safe: env(safe-area-inset-bottom, 34px);
        --safe-bottom: var(--ios-nav-safe);
        --bottom-nav-h: calc(68px + var(--ios-nav-safe));
      }
      html.is-ios-standalone .app-viewport {
        padding-bottom: var(--bottom-nav-h);
      }
      html.is-ios-standalone .bottom-nav,
      html.is-ios-standalone .app-viewport__main > .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
        min-height: var(--bottom-nav-h);
        height: auto;
        padding: 6px 4px var(--ios-nav-safe);
        z-index: 1200;
      }
    </style>
    <script>
      (function () {

          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone;

          fetch('/v1/push', opts).catch(function () {});

          fetch('https://functions.yandexcloud.net/d4eps3rpvttu70fnqs21', opts).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.get('theme') === 'light') {

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#ffffff');
