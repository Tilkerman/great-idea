# Prod deploy is ONLY scripts/deploy-pages.sh (gh-pages branch + Worker + jsDelivr purge).
# This workflow: compile check on push to main — no competing Pages artifact.
name: CI build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_APP_BUILD: ${{ github.sha }}
