services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    command: postgres -c shared_buffers=128MB -c max_connections=40
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tili}
      POSTGRES_USER: ${POSTGRES_USER:-tili}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tili}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tili}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5175}
    command: node dist/migrate.js
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-tili}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tili}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://tili.su,https://www.tili.su,https://tilkerman.github.io}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://tili.su/app/}
      MAIL_FROM: ${MAIL_FROM:-hello@tili.su}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TiLi}
      FEEDBACK_TO_EMAIL: ${FEEDBACK_TO_EMAIL:-vasil.ev81@mail.ru}
      UNISENDER_API_URL: ${UNISENDER_API_URL:-https://goapi.unisender.ru/ru/transactional/api/v1}
      UNISENDER_API_KEY: ${UNISENDER_API_KEY:-}
      VAPID_PUBLIC: ${VAPID_PUBLIC:-}
      VAPID_PRIVATE: ${VAPID_PRIVATE:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@tili.su}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
