<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="apple-touch-icon-v8.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TiLi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TiLi Calendar</title>
    <script>
      (function () {
        var n = window.navigator;
        var standalone = window.matchMedia('(display-mode: standalone)').matches || n.standalone;
        if (!standalone) return;
        var root = document.documentElement;
        var ua = n.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua) || n.standalone;
        var android = /Android/i.test(ua) && !ios;
        root.classList.add('is-standalone');
        if (ios) root.classList.add('is-ios-standalone');
        if (android) root.classList.add('is-android-standalone');
      })();
    </script>
    <style>
      html, body, #root { height: 100dvh; margin: 0; background: #fff; }
      html.is-ios-standalone, html.is-ios-standalone body, html.is-ios-standalone #root { height: 100vh; }
      html.is-onboarding, html.is-onboarding body, html.is-onboarding #root { background: #fff; }
      /*
        iPhone Home only: critical inset before CSS bundle (env() is often 0 in standalone).
      */
      html.is-ios-standalone {
        --safe-bottom: max(env(safe-area-inset-bottom, 0px), 34px);
        --bottom-nav-h: calc(72px + var(--safe-bottom));
      }
      html.is-ios-standalone .app-viewport {
        padding-bottom: var(--bottom-nav-h);
      }
      html.is-ios-standalone .bottom-nav,
      html.is-ios-standalone .app-viewport__main > .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
        box-sizing: content-box;
        min-height: 56px;
        height: auto;
        padding: 8px 8px calc(8px + var(--safe-bottom));
        z-index: 1200;
      }
    </style>
    <script>
      (function () {
        try {
          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone;
          var payload = JSON.stringify({
            action: 'hello',
            deviceId: localStorage.getItem('tili-push-device') || '',
            standalone: Boolean(standalone),
            ua: navigator.userAgent.slice(0, 120),
            from: 'index',
          });
          var opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true };
          fetch('/v1/push', opts).catch(function () {});
          fetch('https://api.tili.su/v1/push', opts).catch(function () {});
          fetch('https://functions.yandexcloud.net/d4eps3rpvttu70fnqs21', opts).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.get('theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#ffffff');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
